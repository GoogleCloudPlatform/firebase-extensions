name: Release incremental capture pipeline

on:
  push:
    tags:
      - 'firestore-incremental-capture-pipeline-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-fic-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The release is cut with gh and GH_TOKEN, so no later step needs the
          # credential left behind in .git/config.
          persist-credentials: false

      # The pom sets maven.compiler.release=11, so any JDK links against the
      # Java 11 class library; pinning JDK 11 anyway keeps the build matched to
      # the JAVA11 flex template base image with no moving parts.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '11'
          # No dependency cache: a cache entry poisoned from a pull request would
          # otherwise feed into a published artifact.

      # A tag whose version does not match the pom would publish an artifact
      # whose internal version lies about its provenance.
      - name: Assert the tag matches the pom version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        working-directory: firestore-incremental-capture-pipeline
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#firestore-incremental-capture-pipeline-v}"
          POM_VERSION="$(mvn --batch-mode -q help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "$TAG_VERSION" != "$POM_VERSION" ]; then
            echo "::error::Tag version ${TAG_VERSION} does not match pom version ${POM_VERSION}."
            exit 1
          fi
          echo "Tag and pom agree on ${POM_VERSION}."

      # Tests run as part of package, so they gate the release.
      - name: Build the shaded jar
        working-directory: firestore-incremental-capture-pipeline
        run: mvn --batch-mode clean package

      - name: Compute checksum
        working-directory: firestore-incremental-capture-pipeline/target
        run: sha256sum restore-firestore.jar > restore-firestore.jar.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: firestore-incremental-capture-pipeline/target/restore-firestore.jar

      # Lets us prove the build and attestation work before cutting a tag.
      - name: Upload artifacts for a dry run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: restore-firestore
          path: |
            firestore-incremental-capture-pipeline/target/restore-firestore.jar
            firestore-incremental-capture-pipeline/target/restore-firestore.jar.sha256
          if-no-files-found: error

      # Guarded on the event too: workflow_dispatch accepts a tag as its ref, so
      # a ref-only check would turn a dry run into a real release.
      # Every release is cut as a pre-release until the channel has a live
      # restore verified behind it; remove --prerelease when going GA.
      - name: Publish the release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --prerelease \
            --title "${GITHUB_REF_NAME}" \
            --notes "Restoration pipeline for firestore-incremental-capture, built from ${GITHUB_SHA}. Verify with: shasum -a 256 -c restore-firestore.jar.sha256" \
            firestore-incremental-capture-pipeline/target/restore-firestore.jar \
            firestore-incremental-capture-pipeline/target/restore-firestore.jar.sha256
